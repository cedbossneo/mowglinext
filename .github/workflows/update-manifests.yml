name: Update deployment catalog

on:
  workflow_call:
    inputs:
      channel:
        type: string
        default: dev
        required: false
  workflow_run:
    workflows: ['GUI — CI', 'ROS2 — CI', 'GUI — Docker', 'ROS2 — Docker', 'Sensors — GPS', 'Sensors — LiDAR LDLiDAR', 'Sensors — LiDAR RPLiDAR', 'Sensors — LiDAR STL27L', 'Protocol Version Drift']
    types: [completed]
    branches: [dev, main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [dev, stable]
        default: dev
      publish:
        description: Promote the checked candidate (dev/main workflow refs only)
        type: boolean
        default: false

# Serialize pointer promotion; a later source head never gets overwritten by an
# older job. Failed/incomplete candidates leave the existing catalog untouched.
concurrency:
  group: update-deployment-catalog
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.target.outputs.channel }}
      revision: ${{ steps.target.outputs.revision }}
      ready: ${{ steps.validate.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Never execute code or consume artifacts from a workflow_run PR head.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'dev' }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      - name: Resolve current channel target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          channel="${REQUESTED_CHANNEL:-dev}"
          if [[ "$EVENT_NAME" == release || "$RUN_BRANCH" == main ]]; then channel=stable; fi
          if [[ "$channel" == stable ]]; then
            version=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            revision=$(git rev-parse "refs/tags/$version^{commit}")
          else
            version=dev
            revision=$(git rev-parse origin/dev)
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Validate complete deployment
        id: validate
        # Other pipelines may still be building. Never turn a successful image
        # build red just because the complete deployment is not ready yet.
        continue-on-error: true
        working-directory: gui
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.target.outputs.revision }}
          CHANNEL: ${{ steps.target.outputs.channel }}
          VERSION: ${{ steps.target.outputs.version }}
        run: go run ./cmd/update-manifest --repository "$GITHUB_REPOSITORY" --ref "$CANDIDATE_SHA" --channel "$CHANNEL" --version "$VERSION" --out "$RUNNER_TEMP/update-candidate"
      - uses: actions/upload-artifact@v7
        if: steps.validate.outcome == 'success'
        with:
          name: deployment-candidate
          path: ${{ runner.temp }}/update-candidate
          retention-days: 14
      - name: Report pending candidate
        if: steps.validate.outcome != 'success'
        run: echo 'Deployment is not ready; existing channel pointer retained. See validation logs for missing evidence.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: candidate
    if: needs.candidate.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || (inputs.publish && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deployment-candidate
          path: candidate
      - name: Atomically publish manifest and channel pointer
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.candidate.outputs.channel }}
          REVISION: ${{ needs.candidate.outputs.revision }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == dev ]]; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/branches/dev" --jq .commit.sha)
            if [[ "$current" != "$REVISION" ]]; then echo 'Newer source is preparing; retain existing catalog.'; exit 0; fi
          else
            version=$(python3 -c 'import json,pathlib; p=json.load(open("candidate/channels/stable.json")); print(json.load(open(pathlib.Path("candidate")/p["path"]))["version"])')
            current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            if [[ "$current" != "$version" ]]; then echo 'Newer release is preparing; retain existing catalog.'; exit 0; fi
          fi
          gh auth setup-git
          mkdir catalog
          cd catalog
          git init
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git ls-remote --exit-code --heads origin update-manifests; then
            git fetch --depth=1 origin update-manifests
            git checkout -b update-manifests FETCH_HEAD
          else
            git checkout --orphan update-manifests
          fi
          # Repeated CI completions for identical images should not create
          # duplicate deployments merely because the observation time changed.
          if python3 - "$CHANNEL" <<'PY'
          import json, pathlib, sys
          channel = sys.argv[1]
          def read(root):
              root = pathlib.Path(root)
              pointer = json.loads((root / 'channels' / (channel + '.json')).read_text())
              return json.loads((root / pointer['path']).read_text())
          try:
              old, new = read('.'), read('../candidate')
              keys = ('schema_version', 'channel', 'source_repository', 'source_revision', 'version', 'notes_url', 'compatibility', 'images')
              sys.exit(0 if all(old[k] == new[k] for k in keys) else 1)
          except FileNotFoundError:
              sys.exit(1)
          PY
          then echo 'Deployment already published.'; exit 0; fi
          cp -R ../candidate/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channels manifests
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish $CHANNEL deployment $REVISION"
          git push origin HEAD:update-manifests
