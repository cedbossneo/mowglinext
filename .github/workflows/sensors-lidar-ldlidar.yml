name: Sensors — LiDAR LDLiDAR

on:
  push:
    tags: ['v*.*.*']
    branches: [main, dev, 'feat/**', 'fix/**', 'refactor/**', 'chore/**', 'perf/**']
    paths:
      - 'sensors/lidar-ldlidar/**'
      - '.github/workflows/sensors-lidar-ldlidar.yml'
      - '.github/workflows/_sensor-docker.yml'
  workflow_dispatch:
    inputs:
      no-cache:
        description: 'Build without Docker layer cache'
        type: boolean
        default: false

concurrency:
  group: sensors-lidar-ldlidar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/_sensor-docker.yml
    with:
      image: lidar-ldlidar
      context: ./sensors/lidar-ldlidar
      target: runtime
      no-cache: ${{ inputs.no-cache == true }}

  update-catalog:
    name: Publish update catalog
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/update-manifests.yml
    with:
      channel: ${{ startsWith(github.ref, 'refs/tags/') && 'stable' || 'dev' }}
